<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>繁星计划 · 带货达人 CASE 集锦 | 腾讯营销鹅选达人</title>
<style>
  /* ============ 基础重置 ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: #1a2240;
    background: #f3f6fb;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }
  img { display: block; max-width: 100%; }

  /* ============ 顶部 Hero ============ */
  .hero {
    position: relative;
    padding: 72px 24px 88px;
    background:
      radial-gradient(1200px 600px at 10% 10%, rgba(0, 212, 255, 0.25), transparent 60%),
      radial-gradient(1000px 500px at 90% 0%, rgba(123, 92, 255, 0.28), transparent 60%),
      linear-gradient(135deg, #0a0e2e 0%, #1a2160 50%, #0d1a4a 100%);
    color: #fff;
    overflow: hidden;
    isolation: isolate;
  }
  .hero::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, #fff, transparent 60%),
      radial-gradient(1px 1px at 28% 60%, #fff, transparent 60%),
      radial-gradient(2px 2px at 45% 14%, #b6e8ff, transparent 60%),
      radial-gradient(1px 1px at 60% 80%, #fff, transparent 60%),
      radial-gradient(1.5px 1.5px at 72% 35%, #fff, transparent 60%),
      radial-gradient(1px 1px at 85% 70%, #fff, transparent 60%),
      radial-gradient(2px 2px at 92% 20%, #ffe07a, transparent 60%),
      radial-gradient(1px 1px at 8% 75%, #fff, transparent 60%);
    opacity: 0.85;
    z-index: -1;
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.55; }
    to   { opacity: 0.95; }
  }
  .hero-inner {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 28px;
    flex-wrap: wrap;
  }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: #cfe6ff;
    backdrop-filter: blur(8px);
  }
  .hero-badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #00d4ff;
    box-shadow: 0 0 10px #00d4ff;
  }
  .hero h1 {
    font-size: clamp(34px, 5vw, 56px);
    font-weight: 800;
    letter-spacing: 2px;
    line-height: 1.1;
    background: linear-gradient(90deg, #ffffff 0%, #9ad8ff 50%, #7c5cff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(122, 184, 255, 0.25);
  }
  .hero h1 .accent { color: #ffe07a; -webkit-text-fill-color: #ffe07a; }
  .hero .subtitle {
    margin-top: 8px;
    font-size: clamp(15px, 1.6vw, 18px);
    color: #b9c8e8;
    max-width: 680px;
  }
  .hero .meta {
    margin-top: 18px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .hero .meta span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px;
    font-size: 12.5px;
    color: #d6e1f7;
  }

  /* ============ 主体容器 ============ */
  .container {
    max-width: 1180px;
    margin: -40px auto 80px;
    padding: 0 24px;
    position: relative;
    z-index: 2;
  }

  /* ============ Tabs ============ */
  .tabs {
    background: #ffffff;
    border-radius: 18px;
    padding: 22px 22px 8px;
    box-shadow: 0 18px 40px -20px rgba(20, 32, 80, 0.18);
  }
  .tab-group + .tab-group {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed #e3e9f5;
  }
  .tab-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: #5a6685;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .tab-label .tag {
    background: linear-gradient(135deg, #4d8eff, #7c5cff);
    color: #fff;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    letter-spacing: 1px;
  }
  .tab-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .tab-btn {
    appearance: none;
    border: 1.5px solid #e0e7f3;
    background: #f7f9fd;
    color: #2a3357;
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s ease;
    line-height: 1.2;
  }
  .tab-btn:hover {
    border-color: #4d8eff;
    color: #296bef;
    background: #eef4ff;
  }
  .tab-btn.is-active {
    background: linear-gradient(135deg, #296bef, #7c5cff);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 8px 18px -8px rgba(41, 107, 239, 0.6);
  }

  /* ============ 简介条 ============ */
  .context-bar {
    margin: 24px 0 18px;
    padding: 14px 18px;
    background: linear-gradient(90deg, rgba(41, 107, 239, 0.08), rgba(124, 92, 255, 0.08));
    border-left: 4px solid #296bef;
    border-radius: 10px;
    font-size: 14px;
    color: #34406b;
  }
  .context-bar strong { color: #1a2240; }

  /* ============ Case 卡片网格 ============ */
  .cases {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 24px;
  }
  .case-card {
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 40px -22px rgba(20, 32, 80, 0.22);
    display: flex;
    flex-direction: column;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    border: 1px solid #eef1f8;
  }
  .case-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 28px 50px -22px rgba(20, 32, 80, 0.32);
  }

  /* 单图封面 */
  .case-cover {
    position: relative;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    background: #0a0e2e;
  }
  .case-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .case-cover.square {
    aspect-ratio: 1 / 1;
  }
  .case-cover .rank-tag {
    position: absolute;
    top: 14px;
    left: 14px;
    background: rgba(255,255,255,0.92);
    color: #296bef;
    font-size: 11.5px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 6px;
    letter-spacing: 0.5px;
    backdrop-filter: blur(4px);
  }
  .case-cover .cover-cta {
    position: absolute;
    bottom: 14px;
    right: 14px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #296bef, #7c5cff);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 8px 18px -6px rgba(41, 107, 239, 0.7);
  }

  /* 多图画廊（618 节点 · 平铺展示） */
  .gallery-cover {
    position: relative;
    padding: 16px;
    background: linear-gradient(135deg, #0a0e2e 0%, #1a2160 100%);
  }
  .gallery-cover .rank-tag {
    position: absolute;
    top: 16px;
    left: 16px;
    background: rgba(255,255,255,0.92);
    color: #296bef;
    font-size: 11.5px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 6px;
    letter-spacing: 0.5px;
    z-index: 2;
    backdrop-filter: blur(4px);
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .gallery-item {
    position: relative;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 8px;
    background: #1a2160;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .gallery-item:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 12px 22px -8px rgba(0,0,0,0.5);
    z-index: 1;
  }
  .gallery-item.is-main {
    border: 2px solid #ffe07a;
    box-shadow: 0 0 0 3px rgba(255, 224, 122, 0.25);
  }
  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .gallery-item .gallery-num {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    backdrop-filter: blur(4px);
  }
  .gallery-item .gallery-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 14px 8px 6px;
    background: linear-gradient(0deg, rgba(0,0,0,0.75), transparent);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.3px;
  }

  /* 程雷 · 侧边小头像布局 */
  .case-body.side-avatar {
    flex-direction: row;
    align-items: flex-start;
    gap: 20px;
    padding: 24px;
  }
  .side-avatar-col {
    flex-shrink: 0;
    width: 120px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .side-avatar-img {
    width: 120px;
    height: 120px;
    border-radius: 16px;
    object-fit: cover;
    box-shadow: 0 10px 22px -8px rgba(20, 32, 80, 0.35);
    border: 3px solid #fff;
  }
  .side-avatar-rank {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: #296bef;
    background: #eef4ff;
    padding: 5px 6px;
    border-radius: 7px;
    letter-spacing: 0.5px;
    line-height: 1.3;
  }
  .side-avatar-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* 卡片正文 */
  .case-body {
    padding: 22px 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
  }

  /* 横排布局：左图右文（优秀达人每周推荐）·图片按原比例完整显示，不裁切 */
  .case-card.image-side {
    flex-direction: row;
    align-items: flex-start;
  }
  .case-card.image-side .case-cover {
    flex: 0 0 38%;
    aspect-ratio: auto;
  }
  .case-card.image-side .case-cover img {
    width: 100%;
    height: auto;
    display: block;
  }
  .case-card.image-side .case-body {
    flex: 1 1 0;
    min-width: 0;
  }
  .case-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .case-meta .chip {
    font-size: 11.5px;
    color: #296bef;
    background: #eef4ff;
    padding: 3px 9px;
    border-radius: 5px;
    font-weight: 600;
  }
  .case-meta .chip.theme {
    color: #7c5cff;
    background: #f0ebff;
  }
  .influencer-name {
    font-size: 26px;
    font-weight: 800;
    color: #1a2240;
    display: flex;
    align-items: center;
    gap: 10px;
    line-height: 1.2;
    flex-wrap: wrap;
  }
  .influencer-name .star-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffe07a, #ff9a3c);
    color: #fff;
    font-size: 15px;
    box-shadow: 0 6px 12px -4px rgba(255, 154, 60, 0.6);
    flex-shrink: 0;
  }
  .influencer-name .star-mark {
    color: #296bef;
    font-size: 18px;
    margin-left: 4px;
  }
  .case-title {
    font-size: 14.5px;
    font-weight: 600;
    color: #2a3357;
    line-height: 1.5;
  }

  /* 数据小卡片 */
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 4px;
  }
  .stat {
    background: linear-gradient(135deg, #f7f9fd, #eef4ff);
    border: 1px solid #e3e9f5;
    border-radius: 10px;
    padding: 10px 12px;
  }
  .stat .label {
    font-size: 11.5px;
    color: #6b7794;
  }
  .stat .value {
    font-size: 18px;
    font-weight: 800;
    color: #296bef;
    margin-top: 2px;
  }
  .stat.hot .value { color: #ff5a3c; }
  .stat .value small {
    font-size: 12px;
    color: #6b7794;
    font-weight: 500;
    margin-left: 2px;
  }

  /* 描述区 */
  .case-desc {
    font-size: 13.5px;
    color: #4a5572;
    line-height: 1.7;
    background: #fafbff;
    border-radius: 10px;
    padding: 14px 16px;
    border-left: 3px solid #4d8eff;
  }
  .case-desc b {
    color: #296bef;
    background: linear-gradient(180deg, transparent 60%, rgba(41,107,239,0.18) 60%);
  }
  .case-desc .emoji-bullet {
    display: block;
    padding: 4px 0;
  }
  .case-desc .emoji-bullet:first-child { padding-top: 0; }
  .case-desc .emoji-bullet:last-child { padding-bottom: 0; }

  /* 推荐理由要点列表 */
  .reason-list {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .reason-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    font-size: 13px;
    line-height: 1.6;
    color: #4a5572;
  }
  .reason-num {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, #296bef, #7c5cff);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .reason-item b {
    color: #1a2240;
    font-weight: 700;
  }

  /* 链接 */
  .case-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: auto;
    padding: 12px 18px;
    border-radius: 10px;
    background: linear-gradient(135deg, #296bef, #7c5cff);
    color: #fff !important;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 10px 22px -10px rgba(41, 107, 239, 0.6);
  }
  .case-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 26px -10px rgba(41, 107, 239, 0.7);
  }
  .case-link svg { width: 16px; height: 16px; }

  /* ============ 空状态 ============ */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #6b7794;
  }
  .empty .emoji {
    font-size: 48px;
    margin-bottom: 12px;
  }

  /* ============ Footer ============ */
  .footer {
    text-align: center;
    padding: 30px 24px 40px;
    color: #6b7794;
    font-size: 13px;
  }
  .footer .row { margin-top: 6px; }

  /* ============ 响应式 ============ */
  @media (max-width: 860px) {
    .case-card.image-side { flex-direction: column; }
    .case-card.image-side .case-cover { flex: none; aspect-ratio: 3 / 4; }
  }
  @media (max-width: 640px) {
    .hero { padding: 56px 20px 72px; }
    .tabs { padding: 18px 16px 6px; }
    .case-body { padding: 18px 18px 20px; }
    .influencer-name { font-size: 22px; }
    .cases { grid-template-columns: 1fr; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    .case-body.side-avatar { flex-direction: column; align-items: stretch; gap: 16px; }
    .side-avatar-col { width: 100%; flex-direction: row; align-items: center; gap: 14px; }
    .side-avatar-img { width: 84px; height: 84px; }
    .side-avatar-rank { flex: 1; text-align: left; }
  }
</style>
</head>
<body>

<!-- ========== Hero ========== -->
<header class="hero">
  <div class="hero-inner">
    <div style="flex:1; min-width: 280px;">
      <div class="hero-badge">
        <span class="dot"></span>
        消电日百中心 · 垂直电商达人团队 出品
      </div>
      <h1>繁星 <span class="accent">★</span> 计划<br />带货达人 CASE 集锦</h1>
      <p class="subtitle">面向服务商与达人：精选视频号带货优秀案例，按 PR 节点 × 主题双维度归类，配套原图海报与官方 PR 文章链接，助力找对人、选对品、打好仗。腾讯营销「鹅选达人」/ 繁星计划。</p>
      <div class="meta">
        <span>🪐 覆盖 2 大 PR 节点</span>
        <span>🌟 收录 3 大主题</span>
        <span>🚀 10 位达人 CASE</span>
        <span>📈 实战数据可复盘</span>
      </div>
    </div>
  </div>
</header>

<!-- ========== Tabs + Cases ========== -->
<main class="container">

  <div class="tabs">
    <!-- 一级 Tab：PR 节点 -->
    <div class="tab-group">
      <div class="tab-label">
        <span class="tag">一级</span>
        <span>PR 节点</span>
        <span style="color:#9aa5c0;">（按行业节奏 / 达人分类）</span>
      </div>
      <div class="tab-list" id="pr-tabs">
        <button class="tab-btn is-active" data-pr="node1">行业节点 / 专场</button>
        <button class="tab-btn" data-pr="node2">达人深度拆解</button>
      </div>
    </div>
    <!-- 二级 Tab：主题 -->
    <div class="tab-group">
      <div class="tab-label">
        <span class="tag" style="background:linear-gradient(135deg,#7c5cff,#296bef);">二级</span>
        <span>主题</span>
        <span style="color:#9aa5c0;">（按当前 PR 节点联动）</span>
      </div>
      <div class="tab-list" id="theme-tabs"></div>
    </div>
  </div>

  <!-- 当前语境说明 -->
  <div class="context-bar" id="context-bar"></div>

  <!-- CASE 卡片区 -->
  <section class="cases" id="cases"></section>

  <div class="empty" id="empty" style="display:none;">
    <div class="emoji">🪐</div>
    <div>该主题下暂无达人 CASE，敬请期待</div>
  </div>
</main>

<footer class="footer">
  <div>繁星计划 · 带货达人 CASE 集锦</div>
</footer>

<script>
  // ============ 数据源（与更新后的 docx 表格完全一致） ============
  const DATA = {
    // PR 节点
    prNodes: [
      { id: 'node1', name: '行业节点 / 专场' },
      { id: 'node2', name: '达人深度拆解' }
    ],
    // 主题（按 PR 节点分组）
    themes: {
      node1: [
        { id: 't1', name: '618 超会卖 系列' }
      ],
      node2: [
        { id: 't2', name: '鹅选达人「星」范式' },
        { id: 't3', name: '优秀达人每周推荐' }
      ]
    },
    // 达人 CASE（按 主题 分组）
    cases: {
      // 主题 1：618 超会卖（8 位达人画像合集）
      t1: [
        {
          name: '618 带货达人们',
          rank: '节点爆品局 · 8 位达人合集',
          title: '618 超会卖！「鹅选达人」带货高光时刻',
          url: 'https://mp.weixin.qq.com/s/FQetialDFEhseQWHi1ooeg',
          // 多图平铺：image1.png 是主海报（合集封面，跨2x2），其余为各达人画像
          images: [
            '618-cover.jpg',
            '618-d1.jpg',
            '618-d2.jpg',
            '618-d3.jpg',
            '618-d4.jpg',
            '618-d5.jpg',
            '618-d6.jpg',
            '618-d7.jpg'
          ],
          imageCaptions: [
            '合集主图',
            '达人 ①',
            '达人 ②',
            '达人 ③',
            '达人 ④',
            '达人 ⑤',
            '达人 ⑥',
            '达人 ⑦'
          ],
          type: 'gallery',
          stats: [
            { label: '单场直播场观峰值', value: '62<small>万+</small>', hot: true },

      // 主题 2：鹅选达人「星」范式
      t2: [

          ],
          desc: `ADQ 精准投放赋能内容破圈，原生深度内容兜底直播转化。程雷团队依托 <b>「微信豆+ADQ」</b> 广豆联投模式，搭建 <b>「前置种草 → 预约锁客 → 直播转化」</b> 的全链路闭环，实现流量、口碑、销量的高效稳定转化。`,

      // 主题 3：优秀达人每周推荐
      t3: [

        {

          url: 'https://mp.weixin.qq.com/s/s1suCRAJb6MTnLUPwmfMkg',
          image: 'jialing.jpg',
          type: 'image',
          layout: 'side',
          stats: [
            { label: '投放 ROI', value: '突破 10', hot: true },
            { label: '直播场景', value: '混场/低客单' },
            { label: '聚焦品类', value: '日百/厨具/服饰' },
            { label: '合作品牌', value: '童涵春堂/米小西' }
          ],
          desc: `本期推荐达人——<b>嘉玲爱大连</b>。达人持续深耕生活家居领域，聚焦日用百货、厨具、服饰及 3C 家电等品类，拥有精准的女性消费人群和良好的直播带货能力。在「繁星计划」助力下，达人不断拓展投放场景，进一步提升拉新效率与商业转化表现。`,
          reasons: [
            { title: '全域拉新突破转化瓶颈', text: '通过拓展展播新场景，并结合 <b>ADQ 全域精准投放</b> 触达增量人群，即使在混场、低客单价的直播场景下，投放 <b>ROI 仍成功突破 10</b>，展现出稳定的获客及转化能力。' },
            { title: '双链路协同撬动节点流量', text: '采用 <b>"直播预约＋商品下单"</b> 双链路滚动投放策略，通过广告精准承接用户需求，有效撬动直播间开播半小时、1 小时等关键节点流量，持续放大直播间成交效率。' }

    }
  };

  // ============ 状态 ============
  let state = {
    pr: 'node1',
    theme: 't1'
  };

  // ============ 渲染 ============
  const $prTabs = document.getElementById('pr-tabs');
  const $themeTabs = document.getElementById('theme-tabs');
  const $context = document.getElementById('context-bar');
  const $cases = document.getElementById('cases');
  const $empty = document.getElementById('empty');

  function renderThemeTabs() {
    const themes = DATA.themes[state.pr] || [];
    $themeTabs.innerHTML = '';
    themes.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (t.id === state.theme ? ' is-active' : '');
      btn.textContent = t.name;
      btn.dataset.theme = t.id;
      btn.addEventListener('click', () => {
        state.theme = t.id;
        render();
      });
      $themeTabs.appendChild(btn);
    });
  }

  function renderContext() {
    const pr = DATA.prNodes.find(n => n.id === state.pr);
    const theme = (DATA.themes[state.pr] || []).find(t => t.id === state.theme);
    const list = DATA.cases[state.theme] || [];
    const count = list.length;

    // 计算达人画像 / 主图（caption 含"主图/主海报/合集"为主图）
    let mainCount = 0, totalImages = 0;
    list.forEach(c => {
      const caps = c.imageCaptions || [];
      totalImages += caps.length;
      mainCount += caps.filter(cap => /主图|主海报|合集/.test(cap)).length;
    });
    const influencerImgs = totalImages - mainCount;

    let countText;
    if (totalImages > 0 && mainCount > 0) {
      // 合集类：多张图，区分主图与达人
      countText = `收录 <strong>${count}</strong> 个合集 CASE · 含 <strong>${influencerImgs}</strong> 位达人画像 + <strong>${mainCount}</strong> 张主图`;
    } else {
      countText = `收录 <strong>${count}</strong> 位达人 CASE`;
    }

    $context.innerHTML = `当前路径：<strong>${pr.name}</strong> · <strong>${theme ? theme.name : '—'}</strong>　|　${countText}`;
  }

  // 创建画廊封面（618 节点 · 平铺展示）
  function createGalleryCover(c) {
    const cover = document.createElement('div');
    cover.className = 'gallery-cover';
    const imgs = c.images || [];
    const captions = c.imageCaptions || [];

    // 排序徽标
    const rankTag = document.createElement('span');
    rankTag.className = 'rank-tag';
    rankTag.textContent = c.rank || '';
    cover.appendChild(rankTag);

    // 网格
    const grid = document.createElement('div');
    grid.className = 'gallery-grid';
    imgs.forEach((src, i) => {
      const item = document.createElement('div');
      item.className = 'gallery-item' + (i === 0 ? ' is-main' : '');
      const img = document.createElement('img');
      img.src = src;
      img.alt = `${c.name} - ${captions[i] || (i + 1)}`;
      img.loading = 'lazy';
      item.appendChild(img);

      // 编号
      const num = document.createElement('span');
      num.className = 'gallery-num';
      num.textContent = i === 0 ? '主图' : `${i}`;
      item.appendChild(num);

      // 文字标签
      if (captions[i]) {
        const cap = document.createElement('div');
        cap.className = 'gallery-caption';
        cap.textContent = captions[i];
        item.appendChild(cap);
      }
      grid.appendChild(item);
    });
    cover.appendChild(grid);
    return cover;
  }

  // 构造卡片正文内容（meta/name/title/stats/desc/reasons/link）
  // 返回一个 div 容器，可直接 append 到 body
  function buildCaseContent(c) {
    const wrap = document.createElement('div');
    wrap.className = 'case-content';

    // Meta chips
    const meta = document.createElement('div');
    meta.className = 'case-meta';
    const pr = DATA.prNodes.find(n => n.id === state.pr);
    const theme = (DATA.themes[state.pr] || []).find(t => t.id === state.theme);
    meta.innerHTML = `
      <span class="chip">${pr.name}</span>
      <span class="chip theme">${theme ? theme.name : ''}</span>
    `;
    wrap.appendChild(meta);

    // 达人名
    const name = document.createElement('h3');
    name.className = 'influencer-name';
    name.innerHTML = `<span class="star-badge">★</span> ${c.name} <span class="star-mark">★</span>`;
    wrap.appendChild(name);

    // CASE 标题
    const title = document.createElement('div');
    title.className = 'case-title';
    title.textContent = c.title;
    wrap.appendChild(title);

    // 数据 stats
    if (c.stats && c.stats.length) {
      const stats = document.createElement('div');
      stats.className = 'stats';
      c.stats.forEach(s => {
        const stat = document.createElement('div');
        stat.className = 'stat' + (s.hot ? ' hot' : '');
        stat.innerHTML = `<div class="label">${s.label}</div><div class="value">${s.value}</div>`;
        stats.appendChild(stat);
      });
      wrap.appendChild(stats);
    }

    // 描述
    if (c.desc) {
      const desc = document.createElement('div');
      desc.className = 'case-desc';
      desc.innerHTML = c.desc;
      wrap.appendChild(desc);
    }

    // 推荐理由要点
    if (c.reasons && c.reasons.length) {
      const reasonList = document.createElement('div');
      reasonList.className = 'reason-list';
      c.reasons.forEach((r, i) => {
        const item = document.createElement('div');
        item.className = 'reason-item';
        item.innerHTML = `
          <span class="reason-num">${i + 1}</span>
          <div><b>${r.title}</b>　${r.text}</div>
        `;
        reasonList.appendChild(item);
      });
      wrap.appendChild(reasonList);
    }

    // 链接
    const link = document.createElement('a');
    link.className = 'case-link';
    link.href = c.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.innerHTML = `查看 PR 文章 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>`;
    wrap.appendChild(link);

    return wrap;
  }

  function renderCases() {
    const list = DATA.cases[state.theme] || [];
    $cases.innerHTML = '';
    if (list.length === 0) {
      $empty.style.display = 'block';
      return;
    }
    $empty.style.display = 'none';

    list.forEach((c) => {
      const card = document.createElement('article');
      card.className = 'case-card' + (c.layout === 'side' ? ' image-side' : '');

      const isSideAvatar = c.type === 'side-avatar' && c.image;

      // Cover 分支
      if (c.type === 'gallery' && c.images && c.images.length) {
        card.appendChild(createGalleryCover(c));
      } else if (c.type === 'image' && c.image) {
        const cover = document.createElement('div');
        cover.className = 'case-cover' + (c.imageShape === 'square' ? ' square' : '');
        cover.innerHTML = `
          <img src="${c.image}" alt="${c.name}" loading="lazy" />
          <span class="rank-tag">${c.rank || ''}</span>
          <span class="cover-cta" aria-hidden="true">→</span>
        `;
        card.appendChild(cover);
      } else if (!isSideAvatar) {
        const initial = c.name.slice(0, 1);
        const cover = document.createElement('div');
        cover.className = 'case-cover';
        cover.style.cssText = 'background:linear-gradient(135deg,#296bef 0%,#7c5cff 60%,#ff5a8a 100%);display:flex;align-items:center;justify-content:center;color:#fff;';
        cover.innerHTML = `
          <div style="text-align:center;">
            <div style="font-size:120px;font-weight:800;line-height:1;letter-spacing:-4px;text-shadow:0 8px 30px rgba(0,0,0,0.3);">${initial}</div>
            <div style="margin-top:12px;font-size:14px;letter-spacing:4px;opacity:0.85;">CASE</div>
          </div>
          <span class="rank-tag" style="background:rgba(255,255,255,0.92);">${c.rank || ''}</span>
          <span class="cover-cta" aria-hidden="true">→</span>
        `;
        card.appendChild(cover);
      }

      // Body
      const body = document.createElement('div');
      body.className = 'case-body' + (isSideAvatar ? ' side-avatar' : '');

      const content = buildCaseContent(c);

      if (isSideAvatar) {
        // 侧边头像：左侧小图 + 右侧内容
        const col = document.createElement('div');
        col.className = 'side-avatar-col';
        const img = document.createElement('img');
        img.className = 'side-avatar-img';
        img.src = c.image;
        img.alt = c.name;
        img.loading = 'lazy';
        col.appendChild(img);
        const rank = document.createElement('div');
        rank.className = 'side-avatar-rank';
        rank.textContent = c.rank || '';
        col.appendChild(rank);
        body.appendChild(col);
        content.className = 'side-avatar-content';
        body.appendChild(content);
      } else {
        body.appendChild(content);
      }

      card.appendChild(body);
      $cases.appendChild(card);
    });
  }

  function render() {
    [...$prTabs.querySelectorAll('.tab-btn')].forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.pr === state.pr);
    });
    const themes = DATA.themes[state.pr] || [];
    if (!themes.find(t => t.id === state.theme)) {
      state.theme = themes[0] ? themes[0].id : '';
    }
    renderThemeTabs();
    renderContext();
    renderCases();
  }

  // PR Tab 点击
  $prTabs.addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    state.pr = btn.dataset.pr;
    const themes = DATA.themes[state.pr] || [];
    state.theme = themes[0] ? themes[0].id : '';
    render();
  });

  render();
</script>
